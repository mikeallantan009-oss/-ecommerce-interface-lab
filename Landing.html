<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    header {
      background-color: #222;
      padding: 1rem 2rem;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
      align-items: center;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .settings {
      position: relative;
    }

    .settings button {
      background-color: #4f46e5;
      color: #fff;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .settings button:hover {
      background-color: #3730a3;
    }

    .settings-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 110%;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      min-width: 120px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 100;
      flex-direction: column;
    }

    .settings-menu a {
      padding: 0.6rem 1rem;
      text-decoration: none;
      color: #333;
      font-weight: normal;
      display: block;
    }

    .settings-menu a:hover {
      background-color: #f0f0ff;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 2rem;
    }

    .hero {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      padding: 3rem 2rem;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 3rem;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .hero-buttons a button {
      background-color: #fff;
      color: #4f46e5;
      border: none;
      padding: 0.8rem 1.6rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .hero-buttons a button:hover {
      background-color: #e0e0ff;
    }

    section:not(.hero) {
      background-color: #fff;
      padding: 2rem;
      border-radius: 10px;
      margin-bottom: 2rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .product-card {
      display: flex;
      gap: 2rem;
      align-items: center;
      margin-top: 1rem;
    }

    .product-card img {
      width: 200px;
      border-radius: 8px;
    }

    .product-card h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>

  <header>
    <nav aria-label="Main navigation">
    
      <ul>
        <li><a href="landing.html">Home</a></li>
        <li><a href="Products.html">Products</a></li>
        <li><a href="#">Electronics</a></li>
        <li><a href="#">Clothing</a></li>
      </ul>

      <div class="settings">
        <button id="settingsBtn">Settings ▼</button>
        <div class="settings-menu" id="settingsMenu">
          <a href="Account.html">Account</a>
          <a href="Login.html">Logout</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    
    <section class="hero" aria-labelledby="hero-heading">
      <h1 id="hero-heading">Welcome!</h1>
      <p>Discover amazing products.</p>
      <div class="hero-buttons">
        <a href="Products.html">
          <button type="button">Shop Now</button>
        </a>
        <a href="Cart.html">
          <button type="button">Cart</button>
        </a>
      </div>
    </section>

    <section aria-labelledby="featured-heading">
      <h2 id="featured-heading">Featured Products</h2>

      <article class="product-card">
        <img src="Headphones.webp" alt="Wireless Headphones" />
        <div>
          <h3>Wireless Headphones</h3>
          <p>High-quality sound with noise cancellation.</p>
        </div>
      </article>
    </section>

    <section aria-labelledby="discounted-heading">
      <h2 id="discounted-heading">Discounted Products</h2>

      <article class="product-card">
        <img src="table.avif" alt="Wooden Table" />
        <div>
          <h3>Wooden Table</h3>
          <p>Stylish and durable — now at a lower price.</p>
        </div>
      </article>
    </section>
  </main>

  <script>
   
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsMenu = document.getElementById('settingsMenu');

    settingsBtn.addEventListener('click', () => {
      settingsMenu.style.display = settingsMenu.style.display === 'flex' ? 'none' : 'flex';
      settingsMenu.style.flexDirection = 'column';
    });

    window.addEventListener('click', (e) => {
      if (!settingsBtn.contains(e.target) && !settingsMenu.contains(e.target)) {
        settingsMenu.style.display = 'none';
      }
    });
  </script>

</body>
</html>
