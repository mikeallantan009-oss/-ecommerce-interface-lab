<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    header {
      background-color: #222;
      color: #fff;
      padding: 1.5rem 2rem;
    }

    header h1 {
      margin: 0;
    }

    .home-button {
      display: inline-block;
      margin: 0.5rem 2rem;
      background-color: transparent;
      color: #4f46e5;
      text-decoration: none;
      font-size: 1rem;
      padding: 0.4rem 0.8rem;
      border: 1.5px solid #4f46e5;
      border-radius: 5px;
      transition: 0.2s;
    }

    .home-button:hover {
      background-color: #4f46e5;
      color: #fff;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column; 
      gap: 2rem;
    }

    section.checkout-section {
      background-color: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      flex: 1 1 600px;
      min-width: 300px;
    }

    section.checkout-section h2 {
      margin-top: 0;
      margin-bottom: 1rem;
      color: #4f46e5;
    }

    fieldset {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }

    legend {
      font-weight: bold;
      padding: 0 0.5rem;
      color: #4f46e5;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    input[type="text"],
    input[type="number"],
    input[type="email"] {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    input[type="radio"] {
      margin-right: 0.5rem;
    }

    aside.order-summary {
      background-color: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      flex: 0 0 300px;
      height: fit-content;
    }

    aside.order-summary h2 {
      color: #4f46e5;
      margin-top: 0;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .total {
      font-weight: bold;
      font-size: 1.2rem;
    }

    button.place-order {
      width: 100%;
      padding: 0.8rem;
      background-color: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
      transition: background-color 0.2s ease;
    }

    button.place-order:hover {
      background-color: #3730a3;
    }

    @media (min-width: 900px) {
      main {
        flex-direction: row; 
        align-items: flex-start;
      }

      aside.order-summary {
        flex: 0 0 350px; 
      }

      section.checkout-section {
        flex: 1 1 auto; 
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Checkout</h1>
  </header>

  <a href="Cart.html" class="home-button">Back to Cart</a>

  <main>
    <section class="checkout-section">
      <h2>Shipping Information</h2>
      <fieldset>
        <legend>Shipping Address</legend>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" />

        <label for="street">Street Address</label>
        <input type="text" id="street" name="street" placeholder="123 Main St" />

        <label for="zip">ZIP Code</label>
        <input type="text" id="zip" name="zip" placeholder="12345" />
      </fieldset>

      <h2>Payment Method</h2>
      <fieldset>
        <label>
          <input type="radio" name="payment" value="credit-card" checked />
          Credit Card
        </label>
        <label>
          <input type="radio" name="payment" value="paypal" />
          PayPal
        </label>
      </fieldset>
    </section>

    <aside class="order-summary">
      <h2>Order Summary</h2>
      <div class="summary-item">
        <span>Table</span>
        <span>$29.00</span>
      </div>
      <div class="summary-item">
        <span>Wireless Headphones</span>
        <span>$99.00</span>
      </div>
      <div class="summary-item">
        <span>Smart Watch</span>
        <span>$149.00</span>
      </div>
      <hr />
      <div class="summary-item total">
        <span>Total</span>
        <span>$277.00</span>
      </div>
      <button class="place-order" id="placeOrderBtn">Place Order</button>
    </aside>
  </main>

  <script>
    document.getElementById('placeOrderBtn').addEventListener('click', function() {
      alert('Success');
    });
  </script>

</body>
</html>
