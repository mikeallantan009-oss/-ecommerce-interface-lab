<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    header {
      background-color: #222;
      color: #fff;
      padding: 1.5rem 2rem;
    }

    header h1 {
      margin: 0;
    }

    .home-button {
      display: inline-block;
      margin: 0.5rem 2rem;
      background-color: transparent;
      color: #4f46e5;
      text-decoration: none;
      font-size: 1rem;
      padding: 0.4rem 0.8rem;
      border: 1.5px solid #4f46e5;
      border-radius: 5px;
      transition: 0.2s;
    }

    .home-button:hover {
      background-color: #4f46e5;
      color: #fff;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 2rem;
    }

    ul.cart-list {
      list-style: none;
      padding: 0;
      margin: 0 0 2rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    ul.cart-list li {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      background-color: #fff;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    ul.cart-list li:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(79,70,229,0.1);
    }

    ul.cart-list li img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 8px;
      flex-shrink: 0;
    }

    ul.cart-list li h3 {
      margin: 0 1rem;
      flex: 2;
    }

    ul.cart-list li p {
      font-weight: bold;
      color: #4f46e5;
      margin: 0 1rem;
      flex: 1;
      text-align: center;
    }

    ul.cart-list li input[type="number"] {
      width: 60px;
      padding: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .subtotal-section {
      background-color: #fff;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      text-align: right;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 1.5rem;
    }

    .checkout-btn {
      display: inline-block;
      background-color: #4f46e5;
      color: #fff;
      text-decoration: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .checkout-btn:hover {
      background-color: #3730a3;
    }

    .empty-cart {
      background-color: #fff;
      padding: 2rem;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      color: #555;
      font-style: italic;
    }

    @media (max-width: 480px) {
      ul.cart-list li {
        flex-direction: column;
        align-items: flex-start;
      }

      ul.cart-list li h3,
      ul.cart-list li p,
      ul.cart-list li input[type="number"] {
        margin: 0.5rem 0 0 0;
        text-align: left;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Shopping Cart</h1>
  </header>

  <a href="Landing.html" class="home-button">Home</a>

  <main>
   
    <ul class="cart-list">
      <li>
        <img src="Table.avif" alt="Wooden Table" />
        <h3>Table</h3>
        <p>$29.00</p>
        <input type="number" min="1" value="1" />
      </li>

      <li>
        <img src="Headphones.webp" alt="Wireless Headphones" />
        <h3>Wireless Headphones</h3>
        <p>$99.00</p>
        <input type="number" min="1" value="1" />
      </li>

      <li>
        <img src="Smartwatch.webp" alt="Smart Watch" />
        <h3>Smart Watch</h3>
        <p>$149.00</p>
        <input type="number" min="1" value="1" />
      </li>
    </ul>

    <div class="subtotal-section">
      Subtotal: $277.00
    </div>

    <a href="Checkout.html" class="checkout-btn">Proceed to Checkout</a>

    <section class="empty-cart" style="display: none;">
      Your cart is currently empty.
    </section>
  </main>

</body>
</html>
